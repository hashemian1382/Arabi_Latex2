name: Build and Commit Arabic Booklet PDF

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**/*.pdf'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile XeLaTeX Document (Multi-pass with latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -xelatex -file-line-error -interaction=nonstopmode

      - name: Commit and Push PDF to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f main.pdf
          if git diff --staged --quiet; then
            echo "No changes in PDF."
          else
            git commit -m "Automated build: Update main.pdf [skip ci]"
            git push origin master
          fi

      - name: Keep Artifact Backup (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf-backup
          path: main.pdf
